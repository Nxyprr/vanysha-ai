function vAnalisis(){const r=cur.res;return `<div class="two"><section class="card"><h3>Configurar análisis</h3><div class="sc">`+Object.keys(SC).map(k=>`<button class="opt ${cur.sc===k?'on':''}" data-act="sc" data-v="${k}">${SC[k].n}</button>`).join('')+`</div><label>Perfil<select id="prof">`+Object.keys(PF).map(k=>`<option value="${k}" ${cur.prof===k?'selected':''}>${PF[k]}</option>`).join('')+`</select></label><label>Umbral de confianza: <b id="thv">${Math.round(cur.thr*100)} %</b><input type="range" id="thr" min="30" max="99" value="${Math.round(cur.thr*100)}"></label><button class="go" data-act="run">Analizar</button><div class="prg" id="prg" hidden><div><i></i></div><span></span></div></section><section class="card"><h3>Visor</h3>`+(r?`<canvas id="vw" width="640" height="360" role="img" aria-label="Resultado simulado: ${SC[r.sc].n}"></canvas><div id="dl" style="margin-top:10px">${dlist()}</div>`:`<div class="empty"><b>Elige un escenario y pulsa Analizar</b>Los resultados son simulados y siempre iguales para el mismo escenario.</div>`)+`</section></div>`}
function runIt(){if(cur.run)return;cur.run=true;cur.res=null;const stg=['Validando entrada','Preprocesando imagen','Inferencia simulada','Aplicando reglas','Guardando resultados'];const p=$('#prg');p.hidden=false;let i=0;const step=()=>{p.querySelector('i').style.width=(i+1)/stg.length*100+'%';p.querySelector('span').textContent=stg[i]+'…';};step();
const iv=setInterval(()=>{i++;if(i<stg.length){step();return}clearInterval(iv);const rec=mkRec(st.seq++,cur.sc,Date.now(),PF[cur.prof]);st.an.unshift(rec);let al=null;if((cur.prof==='pat'||cur.prof==='all')&&st.rules[cur.sc]){al=mkAl(rec,'nueva');st.al.unshift(al)}logE('Análisis '+rec.id+' · '+SC[rec.sc].n+' · '+rec.prof);if(API.on)apiPush(rec,al);save();cur.res={sc:cur.sc,mode:cur.prof,alert:al};cur.run=false;if(al)notify(al);else toast('Análisis completado');route()},450)}

function connectEvents(){if(API.ev){try{API.ev.close()}catch(e){}}const ws=new WebSocket(wsUrl('/ws/events'));API.ev=ws;ws.onmessage=m=>{let j;try{j=JSON.parse(m.data)}catch(e){return}if(j.type!=='alert'||st.al.some(x=>x.id===j.alert.id))return;st.al.unshift(j.alert);if(j.analysis)st.an.unshift(j.analysis);if(j.evidence){cam.shots.unshift('/api/alerts/'+j.alert.id+'/evidence?token='+encodeURIComponent(API.tok));if(cam.shots.length>6)cam.shots.pop();galUI()}cur.still=true;notify(j.alert);const v=key(),ed=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(v==='comando'||v==='auditoria'||v==='historial'||(v==='alertas'&&!ed))route();else buildNav(v)};ws.onclose=()=>{if(API.ev===ws&&cur.user&&API.tok)setTimeout(()=>{if(cur.user&&API.tok)connectEvents()},3000)}}

const m={srv:true,name:'servidor',close:()=>{try{ws.close()}catch(e){}},detect:v=>new Promise(ok=>{if(ws.readyState!==1)return ok([]);const w=640,h=Math.round(640*v.videoHeight/v.videoWidth);q.width=w;q.height=h;x.drawImage(v,0,0,w,h);pend=ok;setTimeout(()=>{if(pend===ok){pend=null;ok([])}},1500);q.toBlob(b=>{if(!b||ws.readyState!==1)return;ws.send(JSON.stringify({zone:cam.zone}));ws.send(b)},'image/jpeg',.6)})};
ws.onopen=()=>res(m);ws.onerror=()=>res(null);ws.onmessage=e=>{let j;try{j=JSON.parse(e.data)}catch(x2){return}if(j.type==='hello'){m.name=j.detector;setEng('IA real \u00b7 '+j.detector)}else if(j.type==='dets'&&pend){const f=pend,vv=$('#cv');pend=null;f(vv?(j.dets||[]).map(d=>({class:d.c,score:d.p,bbox:[d.x*vv.videoWidth,d.y*vv.videoHeight,d.w*vv.videoWidth,d.h*vv.videoHeight]})):[])}};setTimeout(()=>res(null),4000)})}
async function loadAI(){return API.on?wsModel():loadAILocal()}
function camAlert(r,m,sev){if(API.on)return;camAlertLocal(r,m,sev)}
const _camStop0=camStop;camStop=function(){if(cam.model&&cam.model.srv){cam.model.close();cam.model=null}_camStop0()};
document.addEventListener('click',e=>{if(!API.on)return;const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
if(a==='udel'){e.stopImmediatePropagation();if(cur.cf===v){api('/api/users/'+v,{method:'DELETE'}).then(()=>api('/api/users')).then(u=>{users=u;cur.cf=null;toast('Cuenta eliminada');route()}).catch(x=>{cur.cf=null;toast(x.message);route()})}else{cur.cf=v;cur.still=true;route()}}
else if(a==='al'){e.stopImmediatePropagation();const id=b.dataset.id;api('/api/alerts/'+id,{method:'PATCH',json:{status:v}}).then(r=>{const l=st.al.find(x=>x.id===id);if(l)l.e=r.e;toast('Alerta '+v);route()}).catch(x=>toast(x.message))}
else if(a==='reset'){e.stopImmediatePropagation();toast('Con el backend, los datos se administran en el servidor')}},true);
document.addEventListener('click',e=>{if(!API.on)return;const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
if(a==='out'){API.tok=null;try{sessionStorage.removeItem('vanysha-token')}catch(x){}if(API.ev)API.ev.close()}
else if(a==='rule'){api('/api/rules/'+v,{method:'PATCH',json:{enabled:!!st.rules[v]}}).catch(x=>{st.rules[v]=!st.rules[v];toast(x.message);route()})}});
document.addEventListener('change',e=>{if(API.on&&e.target.classList&&e.target.classList.contains('note'))api('/api/alerts/'+e.target.dataset.id,{method:'PATCH',json:{note:e.target.value}}).catch(x=>toast(x.message))});
async function apiLive(){if(!cur.user||['admin','supervisor','operador'].indexOf(cur.user.role)<0)return;const ks=Object.keys(SC).filter(k=>st.rules[k]);if(!ks.length)return;const k=ks[Math.floor(Math.random()*ks.length)];try{const r=await api('/api/analyses',{method:'POST',json:{scenario:k,profile:'En vivo',duration:DUR[k],confidence:+avg(k).toFixed(3),objects:SC[k].d.length,alert:true}});if(r.alert&&!st.al.some(x=>x.id===r.alert.id)){st.al.unshift(r.alert);st.an.unshift(r.analysis);cur.flash={sc:k,until:Date.now()+3500};cur.still=true;notify(r.alert);const v=key(),ed=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(v==='comando'||v==='auditoria'||v==='historial'||(v==='alertas'&&!ed))route();else buildNav(v)}}catch(e){}}
addEventListener('hashchange',()=>{if(cur.user)route()});boot();
