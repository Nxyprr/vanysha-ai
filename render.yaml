# Despliegue en Render (https://render.com): New > Blueprint > elige este repositorio.
services:
  - type: web
    name: vanysha-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: VANYSHA_ADMIN_PASSWORD
        sync: false            # la defines tú en el panel de Render
      - key: VANYSHA_SECRET
        generateValue: true
      - key: VANYSHA_DETECTOR
        value: auto
      - key: VANYSHA_DEMO_DATA
        value: "1"
